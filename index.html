    .bc-status {

    .bc-footer a:hover {

    .bc-star {
      position: absolute;
      color: #7edbff;
      opacity: .6;
      animation: bcFloat 4s ease-in-out infinite;
      pointer-events: none;
    }

    .bc-star:nth-child(1) {
      top: 12%;
      left: 12%;
      font-size: 22px;
    }

    .bc-star:nth-child(2) {
      top: 25%;
      right: 10%;
      font-size: 15px;
      animation-delay: 1s;
    }

    .bc-star:nth-child(3) {
      bottom: 15%;
      left: 15%;
      font-size: 18px;
      animation-delay: 2s;
    }

    @keyframes bcFloat {

      0%,
      100% {
        transform: translateY(0) rotate(0);
      }

      50% {
        transform: translateY(-12px) rotate(18deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .bc-star {
        animation: none;
      }
